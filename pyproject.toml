[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dragonhydra-intelligence"
version = "0.3.0b1"
description = "Local sports evidence, historical market analysis and decimal odds mathematics"
readme = "docs/distribution/PYTHON.md"
requires-python = ">=3.12"
authors = [{name = "DRAGONHYDRA"}]
dependencies = []

[project.urls]
Repository = "https://github.com/chatgptopenaiagi/DRAGONHYDRA-SCRAPP-INTELLIGENCE"

[project.optional-dependencies]
workstation = ["pypdf==7.1.0", "psutil==7.2.2", "websocket-client==1.8.0", "psycopg[binary]==3.3.9", "pyodbc==5.3.0; sys_platform == 'win32'"]

[project.scripts]
dragonhydra = "dragonhydra_intelligence.cli:main"

[tool.setuptools]
package-dir = {"" = "application"}
py-modules = ["living_launch"]
include-package-data = false

[tool.setuptools.packages.find]
where = ["application"]
namespaces = false

[tool.setuptools.package-data]
living = ["web/*"]
intelligence = ["web/*", "schema.sql"]
